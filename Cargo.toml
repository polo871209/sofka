[package]
name = "sofka"
version = "0.29.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Kubernetes TUI, reimagined in Rust"
repository = "https://github.com/nklmilojevic/sofka"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = { version = "1", features = ["mmap"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
deskribe = "0.1.2"
dhat = { version = "0.3.3", optional = true }
flate2 = "1.1.10"
foldhash = "0.2"
form_urlencoded = "1.2.2"
fs2 = "0.4.3"
futures-util = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = [
  "http1",
  "native-tokio",
  "aws-lc-rs",
  "tls12",
] }
hyper-timeout = "0.5.2"
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
ipnet = "2.12.2"
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4.2.0", default-features = false, features = [
  "runtime",
  "client",
  "derive",
  "ws",
  "http-proxy",
  "socks5",
  "gzip",
  "oidc",
  "rustls-tls",
  "aws-lc-rs",
] }
memchr = "2.8.3"
nucleo-matcher = "0.3"
ratatui = "0.30.2"
regex = "1"
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-webpki = { version = "0.103.15", default-features = false, features = ["aws-lc-rs", "std"] }
secrecy = "0.10.3"
semver = "1.0.28"
serde = "1.0.229"
serde_json = "1.0.151"
serde_yaml = "0.9.34"

similar = "3.2.0"
tar = { version = "0.4.46", default-features = false }
terminal-colorsaurus = "1.0.3"
tokio = { version = "1.53.1", features = ["full"] }
zstd = "0.14"
toml = "1.1.6"
toml_edit = "0.25.15"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = [
  "decompression-gzip",
  "trace",
  "util",
  "map-response-body",
] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
x509-parser = { version = "0.18", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[profile.release]
# Thin LTO: within ~1-3% of fat LTO's runtime at a fraction of the build time.
lto = "thin"
# One unit lets LTO drop more dead code: 25.7 MB -> 20.8 MB, about 2.5 min more build time.
# Keep panic = "unwind": install_panic_hook turns task panics into an in-app error.
codegen-units = 1
strip = true

# Benchmarks must measure shipped codegen, so this mirrors `release` — but
# keeps symbols, because a stripped binary profiles as a wall of hex.
[profile.bench]
lto = "thin"
strip = false
debug = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
sha2 = "0.11.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws-lc-rs", "tls12"] }

[features]
# Widens a couple of test-only constructors (`Cluster::fake`) and exposes
# `benchsupport` so `benches/` can build fixtures against the real types.
# Never enabled for a release build.
bench = []
# Heap profiling: `cargo run --features dhat-heap` writes dhat-heap.json.
dhat-heap = ["dep:dhat"]

[[bench]]
name = "hot_paths"
harness = false
required-features = ["bench"]

# Memory counterpart to the benches: criterion measures time, and the Tier 1
# items are justified by heap. Needs `bench` for the fixtures and `dhat-heap`
# for the allocator that can report live bytes.
[[example]]
name = "memprobe"
required-features = ["bench", "dhat-heap"]

# Fixed-size latency probe for state persistence. Unlike Criterion's adaptive
# iteration count, this can time enqueue latency without building an unbounded
# backlog faster than the filesystem worker can drain it.
[[example]]
name = "state_write_probe"
required-features = ["bench"]
