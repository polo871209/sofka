name: Release

# Rolling personal build: every push to `polo` publishes a release tagged `v<Cargo.toml version>-polo.<run number>`, marks it as the GitHub latest release, and deletes every older release.
# The upstream version keeps the tag out of the major-version range and changes when `polo` rebases onto a new upstream release.
# The `-polo.` suffix keeps the tag apart from upstream version tags, and the run number makes every build unique and increasing for `mise up`.
on:
  push:
    branches: [polo]
    # Files that the binary does not build from. `docs/` stays in: the binary embeds docs/*.md.
    paths-ignore:
      - "*.md"
      - "LICENSE-*"
      - ".github/workflows/ci.yaml"
      - ".github/workflows/sync-upstream.yaml"
      - ".github/FUNDING.yml"
      - ".just/**"
      - "Justfile"
      - ".lefthook.toml"
      - ".oxfmtrc.json"
      - "benches/**"
      - "mise.toml"
      - "renovate.json"
      - "scripts/**"
  workflow_dispatch:

permissions: {}

# Only the newest commit matters, so a new push cancels the build in flight.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # The first run has no cache and builds every dependency.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
    env:
      # Overrides the Cargo.toml release profile (thin LTO, 1 codegen unit, which Cargo.toml prices at about 2.5 min of build time). The cost is a larger binary.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # mise picks the asset by the OS and architecture in its name.
      ASSET: sofka-${{ matrix.target }}.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      # Restores compiled dependencies, so a push rebuilds only the sofka crate.
      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Build
        run: cargo build --release --locked --bin sofka --target "${{ matrix.target }}"

      - name: Package
        run: |
          tar -czf "$ASSET" -C "target/${{ matrix.target }}/release" sofka -C "$GITHUB_WORKSPACE" LICENSE-MIT LICENSE-APACHE README.md
          shasum -a 256 "$ASSET" > "$ASSET.sha256"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and its tag, upload the assets, delete old releases
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the tag
        id: tag
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sofka") | .version')"
          test -n "$version" || { echo "::error::no sofka version in Cargo.toml"; exit 1; }
          echo "tag=v${version}-polo.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Download the archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # A manual re-run keeps the run number, so it finds the tag already released.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes "Rolling build of ${GITHUB_SHA}." --latest
          fi

      # Older tags such as v4 sort above v0.x in mise, so every older release must go.
      - name: Delete older releases
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for old in $(gh release list --limit 100 --json tagName -q '.[].tagName' | grep -vx "$TAG"); do
            gh release delete "$old" --yes
            # --cleanup-tag fails with HTTP 422 when the tag is already gone, so delete the tag only if it exists.
            if gh api "repos/${GH_REPO}/git/ref/tags/${old}" --silent 2>/dev/null; then
              gh api --method DELETE "repos/${GH_REPO}/git/refs/tags/${old}"
            fi
          done
